name: pulse
description: Portfolio-grade crypto market tracker for Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  bloc_concurrency: ^0.3.0
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^8.2.0
  go_router: ^16.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.5.0
  intl: any
  stream_channel: ^2.1.4
  web_socket_channel: ^3.0.3

dev_dependencies:
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
